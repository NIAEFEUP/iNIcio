services:
  websocket:
    build:
      context: ./inicio-ws/
    ports:
      - "1234:1234"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      HOST: 0.0.0.0
      PORT: 1234
  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: inicio
      POSTGRES_PASSWORD: inicio
      POSTGRES_DB: inicio-db
    volumes:
      - pgdata-inicio:/var/lib/postgresql/data
  s3:
    image: "quay.io/minio/minio:latest"
    command: 'server /data --console-address ":9001"'
    environment:
      - MINIO_ROOT_USER=inicio
      - MINIO_ROOT_PASSWORD=inicio123
    volumes:
      - "minio_data:/data"
    ports:
      - 9000:9000 # S3
      - 9001:9001 # UI
  createbuckets:
    image: "quay.io/minio/mc:latest"
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 inicio inicio123 > /dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-inicio};
      "

volumes:
  pgdata-inicio:
  minio_data:
